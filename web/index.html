<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0A0B0F">
  <meta name="description" content="Trace — local, read-only DVR and NVR forensic recovery with verifiable provenance, hash-chained custody and court-ready reports.">
  <title>Trace · DVR &amp; NVR forensic recovery</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles/tokens.css?v=1.0.0">
  <link rel="stylesheet" href="/styles/base.css?v=1.0.0">
  <link rel="stylesheet" href="/styles/layout.css?v=1.0.0">
  <link rel="stylesheet" href="/styles/components.css?v=1.0.0">
  <link rel="stylesheet" href="/styles/pages.css?v=1.0.0">
  <link rel="stylesheet" href="/styles/site.css?v=1.0.0">
  <script type="module" src="/js/main.js?v=1.0.0"></script>
</head>
<body data-mode="boot">
  <a class="skip-link" href="#content" data-action="skip">Skip to content</a>
  <div class="ambient" aria-hidden="true"></div>

  <!-- Product website (#home) -->
  <div id="site-root" class="site" hidden></div>

  <!-- Forensic workspace -->
  <div id="app-shell" class="shell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Workspace sidebar">
      <a class="brand" href="#home" aria-label="Trace home">
        <span class="brand__mark" aria-hidden="true">t<span>·</span></span>
        <span class="brand__text"><span class="brand__name">trace</span><span class="brand__sub">FORENSIC WORKSPACE</span></span>
      </a>
      <div class="sidebar__label"><span class="eyebrow">Workspace</span><span class="pill-tag">LOCAL</span></div>
      <nav class="nav" aria-label="Main navigation">
        <div class="nav__list" id="navigation">
          <span class="nav-indicator" id="nav-indicator" aria-hidden="true"></span>
        </div>
      </nav>
      <div class="sidebar__case">
        <label class="eyebrow" for="case-select">Active case</label>
        <div class="select-wrap select-wrap--dark">
          <select id="case-select" class="select"><option value="">No case selected</option></select>
        </div>
        <button type="button" class="text-link sidebar__create" data-action="new-case"><span>+ Create a case</span></button>
      </div>
      <div class="sidebar__spacer"></div>
      <div class="reassure">
        <span class="live-dot" aria-hidden="true"></span>
        <div><strong>Evidence stays here</strong><small>Local processing · No cloud upload</small></div>
      </div>
      <div class="profile">
        <span class="avatar" id="profile-initials" aria-hidden="true">EX</span>
        <div class="profile__text"><strong id="profile-name">Examiner workspace</strong><small>Local workstation</small></div>
        <button type="button" class="btn btn--icon btn--icon-only btn--sm" data-action="palette" aria-label="Open command menu" title="Command menu (Ctrl K)"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3z"/></svg></button>
      </div>
    </aside>
    <div class="scrim" id="scrim" data-action="close-sidebar" hidden></div>

    <div class="main-col">
      <header class="topbar">
        <div class="topbar__left">
          <button type="button" class="btn btn--icon btn--icon-only topbar__menu" data-action="toggle-sidebar" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <nav class="crumbs" aria-label="Breadcrumb"><a href="#overview">Workspace</a><span class="crumbs__slash" aria-hidden="true">/</span><strong id="breadcrumb" aria-current="page">Overview</strong></nav>
        </div>
        <div class="topbar__right">
          <button type="button" class="search-trigger" data-action="palette" aria-label="Search and jump (Ctrl K)">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
            <span class="search-trigger__text">Search or jump to…</span>
            <kbd class="kbd" id="palette-kbd">Ctrl K</kbd>
          </button>
          <span class="session-pill" id="session-pill" title="Connected to the local Trace server"><span class="live-dot live-dot--sm" aria-hidden="true"></span><span>LOCAL SESSION</span></span>
          <span class="topbar__sep" aria-hidden="true"></span>
          <span class="topbar__date" id="today"></span>
          <span class="avatar avatar--sm" id="topbar-initials" aria-hidden="true">EX</span>
        </div>
      </header>
      <main id="content" class="content" tabindex="-1"></main>
      <footer class="footer">
        <span>TRACE / DVR &amp; NVR EVIDENCE RECOVERY</span>
        <span>SIH26150 <span class="footer__dot" aria-hidden="true">·</span> <span id="footer-version">v—</span></span>
      </footer>
    </div>
  </div>

  <!-- Boot / connection state -->
  <div id="boot" class="boot" role="status" aria-live="polite">
    <span class="brand__mark brand__mark--lg" aria-hidden="true">t<span>·</span></span>
    <p class="boot__text">Connecting to your local workspace…</p>
  </div>

  <section class="toaster" aria-label="Notifications">
    <ol class="toaster__list" id="toasts-alert" aria-live="assertive" aria-relevant="additions"></ol>
    <ol class="toaster__list" id="toasts-status" role="status" aria-live="polite" aria-relevant="additions"></ol>
  </section>
</body>
</html>
